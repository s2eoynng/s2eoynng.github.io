<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>벽돌깨기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Silkscreen&display=swap">
<style>
/* Layout: one-screen arcade cabinet — score bar on top, canvas centered, hint below */
:root {
  --bg: #00163d;
  --panel: #002a6c;
  --fg: #ffffff;
  --muted: #9fb3d9;
  --paddle: #ffffff;
  --ball: #f5b800;
  --b1: #f5b800; --b2: #ffd34d; --b3: #ffffff; --b4: #7fa8e6; --b5: #3d74c9;
  --font-ui: "Do Hyeon", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-num: "Silkscreen", ui-monospace, monospace;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-ui);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px; padding-inline: 16px; padding-block: 12px; box-sizing: border-box;
  user-select: none; -webkit-user-select: none; overflow: hidden;
}
.bar {
  width: min(100%, 420px); display: flex; justify-content: space-between; align-items: baseline;
  font-size: 18px; color: var(--muted);
}
.bar b { font-family: var(--font-num); font-weight: 400; color: var(--fg); font-size: 20px; margin-left: 6px; font-variant-numeric: tabular-nums; }
.lives { color: var(--ball); letter-spacing: 2px; font-size: 18px; }
.stage { position: relative; width: min(100%, 420px); aspect-ratio: 420 / 560; max-height: calc(100% - 80px); }
canvas {
  width: 100%; height: 100%; display: block; background: var(--panel);
  border-radius: 6px; touch-action: none; cursor: none;
}
.overlay {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 12px; text-align: center; background: rgba(0, 22, 61, .78); border-radius: 6px;
}
.overlay h1 { margin: 0; font-size: 44px; font-weight: 400; text-wrap: balance; }
.overlay p { margin: 0; color: var(--muted); font-size: 18px; }
.overlay button {
  font: inherit; font-size: 20px; color: var(--bg); background: var(--ball);
  border: 0; border-radius: 4px; padding: 10px 28px; cursor: pointer;
}
.overlay button:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
.hint { color: var(--muted); font-size: 15px; }
</style>
</head>
<body>

<div class="bar" aria-live="polite">
  <span>점수<b id="score">0</b></span>
  <span>최고<b id="best">0</b></span>
  <span class="lives" id="lives" aria-label="남은 목숨">♥♥♥</span>
</div>
<div class="stage">
  <canvas id="c" width="420" height="560" aria-label="벽돌깨기 게임 화면. 패들로 공을 튕겨 벽돌을 깨세요." role="img"></canvas>
  <div class="overlay" id="ov">
    <h1 id="ovTitle">벽돌깨기</h1>
    <p id="ovText">공을 튕겨서 벽돌을 모두 깨 보세요</p>
    <button id="start">시작하기</button>
  </div>
</div>
<div class="hint">마우스·터치로 움직이기 · ← → 키 · 스페이스로 일시정지</div>

<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 420, H = 560;
const css = getComputedStyle(document.documentElement);
const col = n => css.getPropertyValue(n).trim();
const ROW_COLORS = ['--b1','--b2','--b3','--b4','--b5'].map(col);
const ROW_POINTS = [50, 40, 30, 20, 10];
const COLS = 8, ROWS = 5, BW = 46, BH = 16, GAP = 4, TOP = 70;
const LEFT = (W - (COLS * BW + (COLS - 1) * GAP)) / 2;

const $ = id => document.getElementById(id);
let best = 0;
try { best = +localStorage.getItem('breakout-best') || 0; } catch (e) {}
$('best').textContent = best;

let paddle, ball, bricks, score, lives, level, state = 'menu', keys = {};

function makeBricks() {
  bricks = [];
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      bricks.push({ x: LEFT + c * (BW + GAP), y: TOP + r * (BH + GAP), r, alive: true });
}
function resetBall() {
  ball = { x: paddle.x, y: H - 60, r: 6, vx: 0, vy: 0, stuck: true };
}
function launch() {
  if (!ball.stuck) return;
  const speed = 5 + level * 0.6;
  const a = (Math.random() * 0.6 - 0.3);
  ball.vx = speed * Math.sin(a); ball.vy = -speed * Math.cos(a); ball.stuck = false;
}
function newGame() {
  score = 0; lives = 3; level = 1;
  paddle = { x: W / 2, w: 76, h: 10, y: H - 36 };
  makeBricks(); resetBall(); updateHud();
  state = 'play'; $('ov').hidden = true;
}
function updateHud() {
  $('score').textContent = score;
  $('lives').textContent = '♥'.repeat(lives) || '-';
  if (score > best) {
    best = score; $('best').textContent = best;
    try { localStorage.setItem('breakout-best', best); } catch (e) {}
  }
}
function showOverlay(title, text, btn) {
  $('ovTitle').textContent = title; $('ovText').textContent = text; $('start').textContent = btn;
  $('ov').hidden = false; $('start').focus();
}

// 입력
function movePaddleTo(clientX) {
  const rect = cv.getBoundingClientRect();
  const x = (clientX - rect.left) * (W / rect.width);
  paddle.x = Math.max(paddle.w / 2, Math.min(W - paddle.w / 2, x));
}
cv.addEventListener('pointermove', e => { if (state === 'play') movePaddleTo(e.clientX); });
cv.addEventListener('pointerdown', e => { if (state === 'play') { movePaddleTo(e.clientX); launch(); } });
addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ' && state !== 'menu') {
    e.preventDefault();
    if (ball && ball.stuck && state === 'play') launch();
    else if (state === 'play') { state = 'pause'; showOverlay('일시정지', '스페이스를 누르면 계속해요', '계속하기'); }
    else if (state === 'pause') { state = 'play'; $('ov').hidden = true; }
  }
  if (e.key === 'ArrowUp' && state === 'play') launch();
});
addEventListener('keyup', e => { keys[e.key] = false; });
$('start').addEventListener('click', () => {
  if (state === 'pause') { state = 'play'; $('ov').hidden = true; }
  else newGame();
});

// 업데이트
function update() {
  if (state !== 'play') return;
  if (keys['ArrowLeft']) paddle.x -= 7;
  if (keys['ArrowRight']) paddle.x += 7;
  paddle.x = Math.max(paddle.w / 2, Math.min(W - paddle.w / 2, paddle.x));

  if (ball.stuck) { ball.x = paddle.x; ball.y = paddle.y - ball.r - 1; return; }

  // 작은 단계로 나눠 이동 (벽돌 통과 방지)
  const steps = 3;
  for (let s = 0; s < steps; s++) {
    ball.x += ball.vx / steps; ball.y += ball.vy / steps;

    if (ball.x < ball.r) { ball.x = ball.r; ball.vx *= -1; }
    if (ball.x > W - ball.r) { ball.x = W - ball.r; ball.vx *= -1; }
    if (ball.y < ball.r) { ball.y = ball.r; ball.vy *= -1; }

    // 패들
    const px = paddle.x - paddle.w / 2;
    if (ball.vy > 0 && ball.y + ball.r >= paddle.y && ball.y - ball.r <= paddle.y + paddle.h &&
        ball.x >= px - ball.r && ball.x <= px + paddle.w + ball.r) {
      const hit = (ball.x - paddle.x) / (paddle.w / 2); // -1 ~ 1
      const speed = Math.hypot(ball.vx, ball.vy);
      const ang = hit * 1.05;
      ball.vx = speed * Math.sin(ang); ball.vy = -Math.abs(speed * Math.cos(ang));
      ball.y = paddle.y - ball.r;
    }

    // 벽돌
    for (const b of bricks) {
      if (!b.alive) continue;
      const cx = Math.max(b.x, Math.min(ball.x, b.x + BW));
      const cy = Math.max(b.y, Math.min(ball.y, b.y + BH));
      const dx = ball.x - cx, dy = ball.y - cy;
      if (dx * dx + dy * dy <= ball.r * ball.r) {
        b.alive = false;
        score += ROW_POINTS[b.r]; updateHud();
        if (Math.abs(dx) > Math.abs(dy)) ball.vx *= -1; else ball.vy *= -1;
        ball.vx *= 1.008; ball.vy *= 1.008;
        break;
      }
    }

    // 바닥
    if (ball.y > H + ball.r) {
      lives--; updateHud();
      if (lives <= 0) {
        state = 'over';
        showOverlay('게임 오버', `점수 ${score}점`, '다시 하기');
      } else resetBall();
      return;
    }
  }

  if (bricks.every(b => !b.alive)) {
    level++; makeBricks(); resetBall();
    paddle.w = Math.max(50, paddle.w - 6);
  }
}

// 그리기
function draw() {
  ctx.clearRect(0, 0, W, H);
  if (!bricks) { paddle = { x: W/2, w: 76, h: 10, y: H - 36 }; makeBricks(); resetBall(); }

  for (const b of bricks) {
    if (!b.alive) continue;
    ctx.fillStyle = ROW_COLORS[b.r];
    ctx.fillRect(b.x, b.y, BW, BH);
    ctx.fillStyle = 'rgba(255,255,255,.25)';
    ctx.fillRect(b.x, b.y, BW, 3);
  }

  ctx.fillStyle = col('--paddle');
  ctx.beginPath(); ctx.roundRect(paddle.x - paddle.w / 2, paddle.y, paddle.w, paddle.h, 5); ctx.fill();

  ctx.fillStyle = col('--ball');
  ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = col('--muted');
  ctx.font = '13px ' + col('--font-num');
  ctx.fillText('LV ' + (level || 1), 12, 24);
  if (state === 'play' && ball.stuck) {
    ctx.textAlign = 'center';
    ctx.font = '18px ' + col('--font-ui');
    ctx.fillText('클릭하거나 스페이스를 눌러 발사', W / 2, H - 80);
    ctx.textAlign = 'left';
  }
}

function loop() { update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
